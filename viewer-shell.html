  <span data-room-count aria-live="polite" hidden></span>
 </div>

ke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="14" rx="3" ry="6"/><path d="M10 9 8 5m6 4 2-4m-7 7C1 4 1 18 9 16m6-4c8-8 8 6 0 4m-5 2h4"/></svg></button><label class="form-check"><input class="form-check-input" type="checkbox" data-quiet><span class="form-check-label">Still scene</span></label><span data-area aria-live="polite">Meadow</span></div>
 <div class="viz-controls toolbar sound"><button type="button" class="btn icon-btn" data-water-sound aria-pressed="true" aria-label="Water sound" title="Water sound"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7c3-4 5 4 10 0s7 4 10 0M2 12c3-4 5 4 10 0s7 4 10 0M2 17c3-4 5 4 10 0s7 4 10 0"/></svg></button><button type="button" class="btn icon-btn" data-music-toggle aria-expanded="false" aria-label="Sound mixer" title="Sound mixer"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17V5l11-2v12M9 9l11-2"/><ellipse cx="6" cy="17" rx="3" ry="2"/><ellipse cx="17" cy="15" rx="3" ry="2"/></svg></button></div><section data-focus hidden aria-label="Study Pomodoro">
 <div class="focus-heading"><h2>Alarm clock controls</h2><button type="button" data-focus-close aria-label="Close study timer">×</button></div>
 <div class="focus-settings">
  <div><label for="study-minutes">Study time <span>minutes</span></label><div class="time-stepper"><button type="button" data-time-step="work:-1" aria-label="Decrease study time">−</button><input id="study-minutes" data-study-minutes type="number" min="1" max="180" step="1" value="25"><button type="button" data-time-step="work:1" aria-label="Increase study time">+</button></div></div>
  <div><label for="break-minutes">Break time <span>minutes</span></label><div class="time-stepper"><button type="button" data-time-step="break:-1" aria-label="Decrease break time">−</button><input id="break-minutes" data-break-minutes type="number" min="1" max="60" step="1" value="5"><button type="button" data-time-step="break:1" aria-label="Increase break time">+</button></div></div>
 </div>
 <span class="focus-phase" data-phase>Study</span>
 <output data-clock class="focus-clock" aria-label="Time remaining">25:00</output>
 <progress data-focus-progress value="0" max="1" aria-label="Session progress"></progress>
 <div class="focus-actions"><button type="button" data-timer>Start</button><button type="button" data-reset>Reset</button></div>
 <p data-focus-status aria-live="polite">Choose your session lengths, then start.</p>
</section>

 <p class="text-small walking-help">Space to walk / pause · WASD / arrows to move · drag to look · Esc to pause <span aria-hidden="true">·</span> <span data-season></span></p>
 <details data-mixer><summary>Sound mixer</summary>
  <label class="form-label">Water <input type="range" data-level="water" min="0" max="100" value="65"></label>
  <label class="form-label">Rain <input type="range" data-level="rain" min="0" max="100" value="45"></label>
  <label class="form-label">Crickets and woodland <input type="range" data-level="woodland" min="0" max="100" value="30"></label>
  <label class="form-label">Music <input type="range" data-level="music" min="0" max="100" value="35"></label>
  <label class="form-label" hidden>Vinyl shelf <select data-vinyl-choice aria-label="Vinyl shelf"><option value="">Choose a record</option></select></label>
  <p class="text-small" data-vinyl-status>Choose a local audio file to play on the turntable.</p>
  <label class="form-label">Choose a song <input class="form-control" type="file" accept="audio/*" data-music></label>
  <audio controls loop aria-label="Your background music"></audio>
 </details>
 <section id="calendar-panel" data-calendar-panel hidden aria-labelledby="calendar-heading">
  <h2 id="calendar-heading">Calendar and weather</h2>
  <label class="form-label">Month <select data-calendar-month>
   <option value="0">Live calendar · India time</option>
   <option value="1">January</option><option value="2">February</option><option value="3">March</option>
   <option value="4">April</option><option value="5">May</option><option value="6">June</option>
   <option value="7">July</option><option value="8">August</option><option value="9">September</option>
   <option value="10">October</option><option value="11">November</option><option value="12">December</option>
  </select></label>
  <label class="form-label" hidden>Weather <select hidden data-calendar-weather>
   <option value="clear">Clear</option><option value="rain">Rain</option><option value="snow">Snow</option><option value="mist">Mist</option>
  </select></label>
 </section>
 <section id="room-panel" data-room-panel hidden aria-labelledby="room-heading">
  <header><h2 id="room-heading">Visit together</h2></header>
  <p class="text-small" data-room-status role="status"></p>
  <div data-room-entrance>
   <form data-room-form>
    <label class="form-label">Your name <input class="form-control" data-room-name maxlength="28" autocomplete="nickname"></label>
    <button class="btn" type="submit" data-room-join>Create room</button>
   </form>
  </div>
  <div data-room-live hidden>
   <label class="form-label">Invite link <input class="form-control" data-room-invite readonly></label>
   <button class="btn" type="button" data-room-copy>Copy link</button>
   <ul data-room-roster aria-label="People here"></ul>
   <div data-room-host hidden>
    <button class="btn" type="button" data-room-cinema>Open projector</button>
    <form data-room-source-form>
     <label class="form-label">Video URL or local media path <input class="form-control" data-room-source placeholder="/media/movie.mp4" maxlength="1500" required></label>
     <button class="btn" type="submit">Set video</button>
    </form>
    <div data-room-media hidden>
     <button class="btn" type="button" data-room-play disabled>Play for everyone</button>
     <form data-room-seek-form>
      <label>Seek <input type="number" data-room-seek min="0" step="0.1" value="0" disabled> seconds</label>
      <button class="btn" type="submit">Go</button>
     </form>
    </div>
   </div>
   <div class="viz-controls room-actions">
    <button class="btn" type="button" data-room-view disabled>Watch from cinema</button>
    <button class="btn" type="button" data-room-enable disabled>Enable playback</button>
    <button class="btn" type="button" data-room-leave>Leave room</button>
   </div>
  </div>
 </section>
 <section data-cinema-controls hidden aria-label="Outdoor cinema controls">
  <div class="viz-controls">
   <label class="btn cinema-file-label" data-solo-movie>Choose video<input type="file" accept="video/*,.mp4,.webm,.m4v,.mov" data-cinema-file aria-label="Choose video"></label>
   <button class="btn" type="button" data-cinema-play hidden>Play</button>
   <button class="btn" type="button" data-cinema-seat="0" aria-pressed="false">Left couch</button>
   <button class="btn" type="button" data-cinema-seat="1" aria-pressed="false">Right couch</button>
  </div>
  <input type="range" data-cinema-seek aria-label="Movie position" min="0" max="1" step=".1" value="0" hidden>
  <p class="text-small" data-cinema-status role="status" hidden></p>
 </section>
 <div data-cinema-fade aria-hidden="true"></div>
 <dialog data-book-paper aria-labelledby="book-title">
  <form method="dialog"><button class="btn" type="submit" aria-label="Close book note">×</button></form>
  <p class="book-kicker">Little Stream Book Café</p>
  <h2 id="book-title"></h2>
  <p data-book-author hidden></p>
 </dialog>
 <div data-book-pick hidden>
  <label>Browse books <select data-book-list><option value="">Choose a book</option></select></label>
 </div>
 <div data-detail hidden><div class="insect-view"><canvas aria-label="Close-up of a six-legged firefly with antennae, wings and a glowing abdomen"></canvas></div><button class="btn" data-action="back">Back to the path</button></div>
 <p data-error role="alert" hidden></p>
</div>
<style>
#firefly-walk { position:relative; isolation:isolate; height:100vh; height:100dvh; overflow:hidden; color:var(--foreground); }
#firefly-walk .landscape { position:absolute; inset:0; z-index:-1; }
#firefly-walk canvas { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
#firefly-walk canvas:active { cursor:grabbing; }
#firefly-walk .toolbar { position:absolute; gap:2px; }
#firefly-walk .toolbar:first-child { top:10px; left:12px; }
#firefly-walk .destinations { bottom:32px; left:12px; max-width:calc(100% - 24px); box-sizing:border-box; }
#firefly-walk .sound { top:10px; right:12px; }
#firefly-walk .icon-btn { display:grid; place-items:center; padding:0; width:32px; height:32px; min-height:0; border:0; border-radius:50%; background:transparent; color:#fcf7ee; opacity:.78; }
#firefly-walk .icon-btn svg { width:16px; height:16px; filter:drop-shadow(0 1px 2px #121724); }

#firefly-walk .icon-btn:hover { background:#171d2833; opacity:1; }
#firefly-walk .walking-help { position:absolute; bottom:10px; left:18px; margin:0; text-shadow:0 1px 3px #121724,0 0 6px #121724; }
#firefly-walk .destinations label, #firefly-walk [data-area] { margin-left:6px; text-shadow:0 1px 3px #121724,0 0 6px #121724; }
@media(pointer:coarse) { #firefly-walk .icon-btn { width:44px; height:44px; } }
#firefly-walk details, #firefly-walk [data-focus], #firefly-walk [data-detail], #firefly-walk [data-error] { position:absolute; background:#171d28f2; border-radius:12px; padding:12px; }
#firefly-walk details { top:51px; right:12px; max-width:calc(100% - 48px); }
#firefly-walk details:not([open]) { background:transparent; padding:3px 5px; font-size:12px; text-shadow:0 1px 3px #121724,0 0 6px #121724; }
#firefly-walk [data-cinema-fade] { position:absolute; inset:0; z-index:3; background:#0a0d18; opacity:0; pointer-events:none; }
#firefly-walk [data-focus] { left:auto; right:18px; bottom:110px; width:min(360px,calc(100% - 36px)); max-width:none; max-height:calc(100% - 170px); overflow:auto; box-sizing:border-box; padding:22px; background:#faf7eff5; color:#392f28; border:1px solid #e4dfd3; border-radius:22px; box-shadow:0 12px 38px #18211726; text-align:center; }
#firefly-walk .focus-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
#firefly-walk .focus-heading h2 { margin:0; font:500 18px Georgia,serif; color:#392f28; }
#firefly-walk [data-focus-close] { border:0; background:transparent; color:#756b61; font-size:22px; cursor:pointer; padding:0 4px; }
#firefly-walk .focus-settings { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px; }
#firefly-walk .focus-settings label { display:block; text-align:left; color:#756e61; font-size:10px; line-height:1.5; margin-bottom:6px; }
#firefly-walk .focus-settings label span { color:#948c7d; }
#firefly-walk .time-stepper { display:flex; align-items:center; background:#f0ece2; border:1px solid #e5e0d4; border-radius:18px; padding:4px 2px; }

#firefly-walk .time-stepper input { width:100%; min-width:0; padding:3px 0; border:0; outline-offset:2px; background:transparent; text-align:center; color:#392f28; font:400 13px system-ui; appearance:textfield; -moz-appearance:textfield; }

@media(pointer:coarse) { #firefly-walk details { top:61px; } }

#firefly-walk [data-room-count] { font-size:12px; margin-inline:4px; text-shadow:0 1px 5px #151521; }

#firefly-walk .control-dock{position:absolute;z-index:4;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:7px 10px;border-radius:20px;background:#232b2ee6;max-width:calc(100% - 24px);overflow-x:auto;box-sizing:border-box;}
#firefly-walk .dock-group{display:flex;gap:2px;flex-shrink:0;border-right:1px solid #ffffff30;padding-right:8px;}
#firefly-walk .dock-group:last-child{border:0;padding-right:0;}
#firefly-walk .control-dock .icon-btn{width:44px;height:44px;flex-shrink:0;opacity:.95;}
#firefly-walk .control-dock .icon-btn svg{width:23px;height:23px;}
#firefly-walk .destinations{bottom:92px;}
#firefly-walk [data-calendar-panel]{top:auto;bottom:96px;}

#firefly-walk [data-calendar-panel] .form-label{position:relative;}
#firefly-walk .month-menu{position:absolute;bottom:100%;left:0;right:0;max-height:min(420px,55vh);overflow-y:auto;background:#25302d;border:1px solid #978e76;border-radius:12px;padding:5px;z-index:8;}
#firefly-walk .month-menu button{display:block;width:100%;padding:10px;text-align:left;border:0;background:transparent;color:#f5edda;cursor:pointer;}
#firefly-walk .month-menu button:hover{background:#526356;}
#firefly-walk [data-focus]{width:290px;padding:14px;background:#303b35f5;color:#eee4cc;border:2px solid #b66b53;border-radius:12px;}
#firefly-walk .focus-clock,#firefly-walk [data-focus-progress],#firefly-walk .focus-phase{display:none;}
#firefly-walk .focus-heading h2,#firefly-walk .focus-settings label,#firefly-walk [data-focus-status]{color:#eee4cc;}
#firefly-walk .focus-settings{margin-bottom:12px;}

pondShortcut.onclick=()=>{leaveCinema();if(atDesk)$('[data-action="desk"]').click();leaveGardenChair(false);stop();camera.position.copy(world.pondView);yaw=0;pitch=-.12;persist();};
chairShortcut.onclick=()=>{if(gardenSitting){leaveGardenChair();persist();return;}leaveCinema();if(atDesk)$('[data-action="desk"]').click();stop();gardenReturn.copy(camera.position);camera.position.copy(world.cinemaSeats[0]);yaw=-Math.PI/2;pitch=-.04;gardenSitting=true;labelIcon(chairShortcut,'Stand up from garden chair',true);persist();};
function startWalking(){
 leaveGardenChair();
 if(atDesk)$('[data-action="desk"]').click();
 if(detail)$('[data-action="back"]').click();
 initSound();
 walking=true;keys.clear();
 if(cinemaView&&seatIndex>=0){
  seatIndex=-1;
  camera.position.copy(world.move(camera.position,0,0));
  root.querySelectorAll('[data-cinema-seat]').forEach(button=>button.setAttribute('aria-pressed','false'));
 }
 labelIcon($('[data-action="walk"]'),'Pause walking',true);
}
$('[data-action="walk"]').onclick=()=>{
 if(walking)stop();else startWalking();
 persist();
};
window.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  stop();
  persist();return;
 }
 if(cinemaTransition||detail||paper.open||e.target?.closest?.('input, select, textarea, [contenteditable]'))return;
 if(e.code==='Space'){
  // Keep native keyboard activation on focused controls.
  if(e.target?.closest?.('button, a, summary, [role="button"]'))return;
  e.preventDefault();
  if(!e.repeat){if(walking)stop();else startWalking();persist();}
  return;
 }
 const key=e.key.toLowerCase();
 if(!['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(key))return;
 if(!walking&&cinemaView)startWalking();
 if(!walking)return;
 e.preventDefault();keys.add(key);
});
window.addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());if(walking)persist();});window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();$('audio').pause();}last=performance.now();});
const paper=$('[data-book-paper]'),bookList=$('[data-book-list]'),bookPicker=$('[data-book-pick]');
const stairButton=$('[data-stairs]');
stairButton.onclick=()=>{
 if(cinemaTransition)return;
 leaveCinema();
 if(atDesk)$('[data-action="desk"]').click();
 if(detail)$('[data-action="back"]').click();
 const upstairs=insideCafe()&&camera.position.y>world.hut.position.y+4.2;
 camera.position.copy(upstairs?world.stairFoot:world.upstairsPosition);
 yaw=upstairs?0:-1.70;pitch=upstairs?0:-.23;persist();
};
function insideCafe(){
 const x=camera.position.x-world.hut.position.x,z=camera.position.z-world.hut.position.z;
 const b=world.cafeBounds;return x>b.west+.02&&x<b.east-.02&&z>b.back+.02&&z<b.front-.02;
}
function inAttic(){return insideCafe()&&camera.position.y>world.hut.position.y+4.2;}
function nearShelf(){
 const target=world.shelfTarget.getWorldPosition(new T.Vector3());
 const dx=camera.position.x-target.x,dz=camera.position.z-target.z;
 return insideCafe()&&camera.position.y<world.hut.position.y+3&&Math.abs(dz)<1.7&&Math.abs(dx)<1.45;
}

for(const book of world.books){const option=new Option(book.userData.title,book.userData.title);bookList.add(option);}
function openBook(title){
 if(paper.open)return;
 const entry=world.books.find(book=>book.userData.title===title)?.userData;
 if(!entry)return;
 stop();$('#book-title').textContent=title;
 const author=$('[data-book-author]');author.textContent=entry.author;author.hidden=!entry.author;
 paper.showModal();
 initSound();
 const length=Math.floor(audioContext.sampleRate*.27),buffer=audioContext.createBuffer(1,length,audioContext.sampleRate);
 const samples=buffer.getChannelData(0);
 for(let i=0;i<length;i++){const t=i/length;samples[i]=(Math.random()*2-1)*Math.sin(Math.PI*t)**2*(.55+.45*Math.sin(t*23)**2);}
 const source=audioContext.createBufferSource();source.buffer=buffer;
 const filter=audioContext.createBiquadFilter();filter.type='bandpass';filter.frequency.value=1750;
 const gain=audioContext.createGain();gain.gain.value=.13;
 source.connect(filter).connect(gain).connect(audioContext.destination);source.start();
}
bookList.onchange=()=>{if(bookList.value)openBook(bookList.value);bookList.value='';};
paper.addEventListener('click',e=>{if(e.target===paper){const r=paper.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)paper.close();}});
const raycaster=new T.Raycaster();canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect();raycaster.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);if(cinemaView||paper.open)return;
const sleeveHit=raycaster.intersectObjects(world.vinyls,true).find(hit=>hit.distance<3);
if(sleeveHit){let sleeve=sleeveHit.object;while(sleeve&&!sleeve.userData.title)sleeve=sleeve.parent;if(sleeve){chooseVinyl(sleeve.userData.title);return;}}
const hit=nearShelf()?raycaster.intersectObjects(world.books,true)[0]:undefined;
if(hit&&hit.distance<2.2){
 let book=hit.object;while(book&&!book.userData.title)book=book.parent;
 if(book){bookPicker.hidden=false;openBook(book.userData.title);return;}
}
if(nearShelf()&&raycaster.intersectObject(world.shelfTarget).some(hit=>hit.distance<2.2)){
 bookPicker.hidden=false;bookList.focus();return;
}
if(raycaster.intersectObject(world.cafeDoor,true).some(hit=>hit.distance<5)){$('[data-door]').click();return;}if(raycaster.intersectObject(world.musicPlayer,true).some(hit=>hit.distance<3)){initSound();const audio=$('audio');$('[data-mixer]').open=true;if(audio.src){if(audio.paused){listening=true;audio.play().catch(()=>{});}else{listening=false;audio.pause();}}else $('[data-music]').click();}});
canvas.addEventListener('pointerdown',e=>{if(!walking&&!cinemaView&&!inAttic())return;drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.003;pitch=Math.max(-1.1,Math.min(1.1,pitch-(e.clientY-drag.y)*.003));drag={x:e.clientX,y:e.clientY};});for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,()=>{drag=null;persist();});
$('[data-music]').onchange=e=>{
 const file=e.target.files[0];if(!file)return;initSound();const audio=$('audio');audio.pause();
 if(musicURL&&![...vinylTracks.values()].some(track=>track.url===musicURL))URL.revokeObjectURL(musicURL);
 if(selectedVinyl&&vinylTracks.has(selectedVinyl))URL.revokeObjectURL(vinylTracks.get(selectedVinyl).url);
 musicURL=URL.createObjectURL(file);audio.src=musicURL;audio.volume=level('music');
 if(selectedVinyl)vinylTracks.set(selectedVinyl,{url:musicURL,name:file.name});
 listening=true;$('[data-vinyl-status]').textContent=(selectedVinyl?selectedVinyl+' · ':'')+file.name;syncMusic();
};
const bugScene=new T.Scene(),bug=createFirefly(T);bugScene.add(bug.group,new T.HemisphereLight(0xffebd4,0x64768c,2));const bugKey=new T.DirectionalLight(0xffe5bf,3);bugKey.position.set(-2,3,2);bugScene.add(bugKey);const bugCamera=new T.PerspectiveCamera(40,1,.001,10);bugCamera.position.set(.38,.32,.48);bugCamera.lookAt(0,0,-.02);const bugRenderer=new T.WebGLRenderer({canvas:$('.insect-view canvas'),alpha:true,antialias:true});bugRenderer.setPixelRatio(Math.min(devicePixelRatio,1.5));bugRenderer.outputColorSpace=T.SRGBColorSpace;
$('[data-action="closeup"]').onclick=()=>{stop();detail=true;$('[data-detail]').hidden=false;resize();};$('[data-action="back"]').onclick=()=>{detail=false;$('[data-detail]').hidden=true;$('[data-action="walk"]').focus();};
function resize(){const box=canvas.parentElement;renderer.setSize(box.clientWidth,box.clientHeight,false);camera.aspect=box.clientWidth/box.clientHeight;camera.updateProjectionMatrix();if(detail){const b=$('.insect-view');bugRenderer.setSize(b.clientWidth,b.clientHeight,false);bugCamera.aspect=b.clientWidth/b.clientHeight;bugCamera.updateProjectionMatrix();}}
new ResizeObserver(resize).observe(root);restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(document.hidden)return;const quiet=$('[data-quiet]').checked;if(!quiet&&!detail)elapsed+=dt;if(walking&&!detail){let f=Number(keys.has('w')||keys.has('arrowup'))-Number(keys.has('s')||keys.has('arrowdown')),s=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));const l=Math.hypot(f,s)||1;f/=l;s/=l;camera.position.copy(world.move(camera.position,(s*Math.cos(yaw)-f*Math.sin(yaw))*dt*2.1,(-f*Math.cos(yaw)-s*Math.sin(yaw))*dt*2.1));}camera.rotation.set(pitch,yaw,0);
 if(!nearShelf()&&!bookPicker.hidden)bookPicker.hidden=true;
 const stairsLabel=insideCafe()&&camera.position.y>world.hut.position.y+4.2?'Go downstairs':'Go upstairs';
 if(stairButton.title!==stairsLabel){
  stairButton.title=stairsLabel;stairButton.setAttribute('aria-label',stairsLabel);
 }
 if(cinemaView)syncCinemaFilm();updateSound();room?.advance(dt);world.setStudyActive(timer.running);world.advance(elapsed,dt,quiet);if(!quiet)riveElements?.advance(dt);const area=cinemaView?"":camera.position.y>world.hut.position.y+4.3?"Attic":areaAt(camera.position.z);if($('[data-area]').textContent!==area)$('[data-area]').textContent=area;renderer.render(world.scene,camera);if(detail){bug.animate(elapsed,0,quiet);bugRenderer.render(bugScene,bugCamera);}}
const monthPicker=$('[data-calendar-month]'),weatherPicker=$('[data-calendar-weather]');
const calendarPanel=$('[data-calendar-panel]'),calendarToggle=$('[data-calendar-toggle]');
// Opens in April: spring and purple lavender fields. 0 would follow the live calendar.
let calendarMonth=0,weatherChoice='auto';
function setCalendarSeason(name,month=calendarMonth,weather=weatherChoice){
 calendarMonth=month;weatherChoice='auto';weather='auto';
 const nextMonth=month||monthForDate();if(world.month!==nextMonth)world.setMonth(nextMonth);world.setWeather(weather);
 monthPicker.value=String(month);weatherPicker.value=weather;
 const label=world.season.charAt(0).toUpperCase()+world.season.slice(1);
 if($('[data-season]').textContent!==label)$('[data-season]').textContent=label;
}
const monthButton=document.createElement('button');monthButton.type='button';monthButton.className='btn';monthButton.setAttribute('aria-expanded','false');monthPicker.hidden=true;monthPicker.after(monthButton);
const monthMenu=document.createElement('div');monthMenu.className='month-menu';monthMenu.hidden=true;monthButton.after(monthMenu);
function monthLabel(){monthButton.textContent=monthPicker.selectedOptions[0].textContent+' ▴';}monthLabel();
for(const option of monthPicker.options){const button=document.createElement('button');button.type='button';button.textContent=option.textContent;button.onclick=()=>{monthPicker.value=option.value;changeCalendar();monthLabel();monthMenu.hidden=true;monthButton.setAttribute('aria-expanded','false');};monthMenu.append(button);}
monthButton.onclick=()=>{monthMenu.hidden=!monthMenu.hidden;monthButton.setAttribute('aria-expanded',String(!monthMenu.hidden));};
calendarToggle.onclick=()=>{
 calendarPanel.hidden=!calendarPanel.hidden;calendarToggle.setAttribute('aria-expanded',String(!calendarPanel.hidden));
 if(!calendarPanel.hidden){
  $('[data-room-panel]').hidden=true;$('[data-room-toggle]').setAttribute('aria-expanded','false');
 }
};
$('[data-room-toggle]').addEventListener('click',()=>{
 calendarPanel.hidden=true;calendarToggle.setAttribute('aria-expanded','false');
});
function changeCalendar(){
 initSound();
 const month=Number(monthPicker.value),weather=weatherPicker.value;
 if(room?.changeCalendar(month,weather)){
  monthPicker.value=String(calendarMonth);weatherPicker.value=weatherChoice;
  return;
 }
 setCalendarSeason(month?seasonForMonth(month):seasonForDate(),month,weather);
}
monthPicker.onchange=weatherPicker.onchange=changeCalendar;
setCalendarSeason(seasonForDate());
setInterval(()=>{if(!room?.active&&!calendarMonth)setCalendarSeason(seasonForDate());},60_000);
room=mountRoom({
 root,T,world,setSeason:setCalendarSeason,
 getView:()=>({position:camera.position.toArray(),yaw,sky,calendarMonth,weather:weatherChoice,area:cinemaView?'Cinema':inAttic()?'Attic':insideCafe()?'Café':areaAt(camera.position.z)}),
 setSky:value=>{if(value!==sky)selectTime(value);},
 enterCinema:()=>{if(!cinemaView)goToScreen();sitAtCinema(0);}
});
if(['#movie-night','#full-moon-cinema'].includes(location.hash)){
 goToScreen();
 if(location.hash==='#full-moon-cinema')selectTime('fullMoon',true);
}
requestAnimationFrame(frame);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();stop();error.hidden=false;error.textContent='Graphics paused. Reload to continue.';});
}catch(e){error.hidden=false;error.textContent='The 3D view needs WebGL and an internet connection for Three.js. '+e.message;}
</script>
